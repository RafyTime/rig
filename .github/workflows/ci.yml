name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CHEZMOI_VERSION: v2.74.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      # The official installers verify the release checksum.
      - name: Install chezmoi (Linux)
        if: runner.os == 'Linux'
        run: |
          # Download first so a failed fetch stops the job instead of running "sh -c ''".
          curl --proto '=https' --proto-redir '=https' -fsLS https://get.chezmoi.io -o "$RUNNER_TEMP/install-chezmoi.sh"
          sh "$RUNNER_TEMP/install-chezmoi.sh" -b "$HOME/.local/bin" -t "$CHEZMOI_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install chezmoi (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'chezmoi'
          iex "&{$(irm 'https://get.chezmoi.io/ps1')} -BinDir '$bin' -Tag '$env:CHEZMOI_VERSION'"
          $bin >> $env:GITHUB_PATH
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      - run: uv run pytest
