name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CHEZMOI_VERSION: v2.74.2
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      # The official installers verify the release checksum.
      - name: Install chezmoi (Linux)
        if: runner.os == 'Linux'
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin" -t "$CHEZMOI_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install chezmoi (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'chezmoi'
          iex "&{$(irm 'https://get.chezmoi.io/ps1')} -BinDir '$bin' -Tag '$env:CHEZMOI_VERSION'"
          $bin >> $env:GITHUB_PATH
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      - run: uv run pytest
